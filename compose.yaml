name: solo126-saltmark
services:
  desk:
    build:
      context: .
      args:
        SALTMARK_DEPS_IMAGE: ${SALTMARK_DEPS_IMAGE:-python:3.11-slim}
    image: ${SALTMARK_IMAGE:-solo126-saltmark:1.0}
    network_mode: bridge
    ports:
      - "127.0.0.1:${SALTMARK_PORT:-19926}:8000"
    volumes:
      - measurements:/var/lib/saltmark
    init: true
volumes:
  measurements:
